services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nextrole
      POSTGRES_USER: nextrole
      POSTGRES_PASSWORD: nextrole
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextrole"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nextrole
      DB_USERNAME: nextrole
      DB_PASSWORD: nextrole
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32chars-min}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
