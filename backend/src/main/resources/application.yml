spring:
  application:
    name: nextrole-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nextrole}
    username: ${DB_USERNAME:nextrole}
    password: ${DB_PASSWORD:nextrole}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
    # Short-lived access token; clients refresh silently against /api/auth/refresh.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
